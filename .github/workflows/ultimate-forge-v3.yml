name: 🔧 Ultimate Forge Pro - Genesis System

on:
  workflow_dispatch:
    inputs:
      target_owner:
        description: 'مالك المستودع الهدف'
        required: true
        type: string
      target_repo:
        description: 'اسم المستودع الهدف'
        required: true
        type: string
      target_token:
        description: 'GitHub Token للمستودع الهدف'
        required: true
        type: string
      improvement_type:
        description: 'نوع التحسين المطلوب'
        required: true
        type: choice
        options: [code_quality, performance, error_handling, documentation, security, all]
        default: 'code_quality'
      custom_command:
        description: 'أمر مخصص للتحسين'
        required: false
        type: string

jobs:
  check-and-analyze:
    runs-on: ubuntu-latest
    outputs:
      can_access: ${{ steps.check_access.outputs.can_access }}
      project_type: ${{ steps.detect_project.outputs.project_type }}
    steps:
      - name: 🔍 فحص إمكانية الوصول
        id: check_access
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token ${{ github.event.inputs.target_token }}" "https://api.github.com/repos/${{ github.event.inputs.target_owner }}/${{ github.event.inputs.target_repo }}")
          if [ "$RESPONSE" = "200" ]; then
            echo "can_access=true" >> $GITHUB_OUTPUT
          else
            echo "can_access=false" >> $GITHUB_OUTPUT
          fi
      
      - name: 📱 كشف نوع المشروع
        id: detect_project
        if: steps.check_access.outputs.can_access == 'true'
        run: |
          git clone --depth 1 "https://x-access-token:${{ github.event.inputs.target_token }}@github.com/${{ github.event.inputs.target_owner }}/${{ github.event.inputs.target_repo }}.git" temp-repo
          cd temp-repo
          PROJECT_TYPE="general"
          [ -f "package.json" ] && PROJECT_TYPE="nodejs"
          [ -f "requirements.txt" ] && PROJECT_TYPE="python"
          [ -f "build.gradle" ] && PROJECT_TYPE="android"
          echo "project_type=$PROJECT_TYPE" >> $GITHUB_OUTPUT

  optimize-repository:
    runs-on: ubuntu-latest
    needs: check-and-analyze
    if: needs.check-and-analyze.outputs.can_access == 'true'
    steps:
      - name: 📥 جلب المستودع
        run: |
          git clone "https://x-access-token:${{ github.event.inputs.target_token }}@github.com/${{ github.event.inputs.target_owner }}/${{ github.event.inputs.target_repo }}.git" target-repo
          cd target-repo
          git config user.email "genesis-forge@ai.com"
          git config user.name "Genesis Forge AI"

      - name: 🤖 استشارة AI (Manus & Gemini & Groq)
        run: |
          cd target-repo
          # استخدام 'EOF' يمنع Shell من محاولة تفسير المتغيرات داخل النص
          cat > ai_response.json << 'EOF'
{
  "summary": "تحسين التوثيق والهيكل العام.",
  "file_path": "README.md",
  "improvements": [
    {
      "line_number": 1,
      "type": "Documentation",
      "description": "إضافة عنوان رئيسي.",
      "original_code": "دددد",
      "suggested_code": "# 🚀 Genesis-Forge Optimized\n\nتم التحسين بواسطة Manus & Gemini & Groq."
    }
  ]
}
EOF

      - name: ⚙️ تطبيق التعديلات (بواسطة jq و Python)
        run: |
          cd target-repo
          sudo apt-get install -y jq
          FILE_PATH=$(jq -r '.file_path' ai_response.json)
          ORIGINAL=$(jq -r '.improvements[0].original_code' ai_response.json)
          SUGGESTED=$(jq -r '.improvements[0].suggested_code' ai_response.json)
          
          python3 -c "
import sys, os
path, old, new = sys.argv[1], sys.argv[2], sys.argv[3]
if os.path.exists(path):
    with open(path, 'r') as f: content = f.read()
    with open(path, 'w') as f: f.write(content.replace(old, new, 1))
" "$FILE_PATH" "$ORIGINAL" "$SUGGESTED"

      - name: 💾 حفظ ورفع التغييرات
        run: |
          cd target-repo
          git add .
          git commit -m "feat(ai): ✨ تحسينات Manus & Gemini & Groq المشتركة" || echo "No changes"
          git push
