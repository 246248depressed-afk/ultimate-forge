name: 🤖 Ultimate Forge Pro - The AI Engineer

on:
  workflow_dispatch:
    inputs:
      target_owner:
        description: 'مالك المستودع الهدف'
        required: true
        type: string
      target_repo:
        description: 'اسم المستودع الهدف'
        required: true
        type: string
      target_token:
        description: 'GitHub Token للمستودع الهدف (للوصول والكتابة)'
        required: true
        type: string
      improvement_type:
        description: 'نوع التحسين المطلوب'
        required: true
        type: choice
        options:
          - code_quality
          - performance
          - add_feature
          - documentation
          - security
          - all
        default: 'code_quality'
      custom_command:
        description: 'وصف الميزة أو الأمر (مثال: أضف شاشة تسجيل دخول)'
        required: true
        type: string

jobs:
  setup-and-scan:
    runs-on: ubuntu-latest
    outputs:
      project_type: ${{ steps.detect_project.outputs.project_type }}
    steps:
      - name: 📥 جلب المستودع الهدف
        run: |
          set -e
          echo "📥 جلب المستودع الهدف للتحليل..."
          git clone "https://x-access-token:${{ github.event.inputs.target_token }}@github.com/${{ github.event.inputs.target_owner }}/${{ github.event.inputs.target_repo }}.git" target-repo
          echo "✅ تم جلب المستودع."

      - name: 📱 كشف نوع المشروع
        id: detect_project
        run: |
          set -e
          cd target-repo
          PROJECT_TYPE="general"
          if [ -f "build.gradle" ] || [ -f "app/build.gradle" ]; then
            PROJECT_TYPE="android"
          elif [ -f "package.json" ]; then
            PROJECT_TYPE="nodejs"
          elif [ -f "pom.xml" ]; then
            PROJECT_TYPE="java"
          elif [ -f "requirements.txt" ]; then
            PROJECT_TYPE="python"
          fi
          echo "🎯 نوع المشروع المحدد: $PROJECT_TYPE"
          echo "project_type=$PROJECT_TYPE" >> $GITHUB_OUTPUT

      - name: 🗺️ مسح هيكل المشروع (أول 100 ملف)
        run: |
          set -e
          cd target-repo
          find . -type f -not -path '*/\.*' -not -name '*.jar' -not -name '*.exe' | head -n 100 > ../project_structure.txt
          echo "✅ تم إنشاء خريطة المشروع."

      - name: 📤 حفظ نتائج المسح كـ artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: project_structure.txt

  engineer-and-execute:
    runs-on: ubuntu-latest
    needs: setup-and-scan
    timeout-minutes: 30
    steps:
      - name: 📥 استلام نتائج المسح
        uses: actions/download-artifact@v4
        with:
          name: scan-results

      - name: 🧠 بناء برومبت المهندس AI
        run: |
          set -e
          echo "🧠 بناء برومبت شامل للمهندس AI..."
          {
            echo "# 🎯 المهمة: مهندس برمجيات AI"
            echo ""
            echo "أنت \"Genesis Forge AI\"، مهندس برمجيات مستقل. مهمتك هي فهم المشروع الحالي وتنفيذ المهمة المطلوبة بدقة."
            echo ""
            echo "## سياق المشروع"
            echo "- نوع المشروع: ${{ needs.setup-and-scan.outputs.project_type }}"
            echo "- هيكل الملفات (أول 100 ملف):"
            cat project_structure.txt
            echo ""
            echo "## المهمة المطلوبة"
            echo "- نوع المهمة: ${{ github.event.inputs.improvement_type }}"
            echo "- وصف المهمة: \"${{ github.event.inputs.custom_command }}\""
            echo ""
            echo "## تعليمات الإخراج"
            echo "أعد ردًا بصيغة JSON فقط، يحتوي على \"summary\" و \"plan\" حيث كل عنصر في \"plan\" يحتوي على:"
            echo "- action: create | modify | delete"
            echo "- file_path: مسار الملف"
            echo "- content: (لـ create)"
            echo "- original_code و suggested_code: (لـ modify)"
            echo ""
            echo "مثال:"
            echo "{"
            echo "  \"summary\": \"خطة عمل لإضافة شاشة تسجيل دخول بسيطة.\","
            echo "  \"plan\": ["
            echo "    {"
            echo "      \"action\": \"create\","
            echo "      \"file_path\": \"src/main/java/com/example/LoginActivity.java\","
            echo "      \"content\": \"public class LoginActivity { ... }\""
            echo "    },"
            echo "    {"
            echo "      \"action\": \"modify\","
            echo "      \"file_path\": \"AndroidManifest.xml\","
            echo "      \"original_code\": \"<activity android:name=\\\".MainActivity\\\">\","
            echo "      \"suggested_code\": \"<activity android:name=\\\".LoginActivity\\\">\\n<activity android:name=\\\".MainActivity\\\">\""
            echo "    }"
            echo "  ]"
            echo "}"
          } > ai_prompt.txt
          echo "✅ تم بناء البرومبت."

      - name: 🤖 استشارة المهندس AI (محاكاة)
        run: |
          set -e
          echo "🤖 محاكاة استشارة المهندس AI..."
          cat > ai_response.json << 'EOF'
{
  "summary": "خطة عمل لإضافة إعدادات وتعديل README.",
  "plan": [
    {
      "action": "create",
      "file_path": "config/settings.json",
      "content": "{\n  \"theme\": \"dark\",\n  \"version\": \"1.0.0\"\n}"
    },
    {
      "action": "modify",
      "file_path": "README.md",
      "original_code": "ffff",
      "suggested_code": "# 🚀 مشروع Genesis-Forge\n\nتمت إضافة إعدادات جديدة بواسطة المهندس AI."
    }
  ]
}
EOF
          echo "✅ تم استلام خطة العمل من المهندس AI."

      - name: ⚙️ تنفيذ خطة العمل
        run: |
          set -e
          echo "⚙️ تنفيذ خطة العمل المقترحة..."
          git clone "https://x-access-token:${{ github.event.inputs.target_token }}@github.com/${{ github.event.inputs.target_owner }}/${{ github.event.inputs.target_repo }}.git" target-repo
          cd target-repo
          sudo apt-get update -y
          sudo apt-get install -y jq python3
          jq -c '.plan[]' ../ai_response.json | while read -r step; do
            ACTION=$(echo "$step" | jq -r '.action')
            FILE_PATH=$(echo "$step" | jq -r '.file_path')
            echo "▶️ تنفيذ: $ACTION على $FILE_PATH"

            if [ "$ACTION" = "create" ]; then
              CONTENT=$(echo "$step" | jq -r '.content')
              mkdir -p "$(dirname "$FILE_PATH")"
              printf "%s" "$CONTENT" > "$FILE_PATH"
              echo "   - ✅ تم إنشاء الملف."

            elif [ "$ACTION" = "modify" ]; then
              ORIGINAL_CODE=$(echo "$step" | jq -r '.original_code')
              SUGGESTED_CODE=$(echo "$step" | jq -r '.suggested_code')
              if [ ! -f "$FILE_PATH" ]; then
                echo "   - ⚠️ الملف $FILE_PATH غير موجود، تخطي التعديل."
                continue
              fi
              MATCHES=$(grep -F "$ORIGINAL_CODE" "$FILE_PATH" | wc -l)
              if [ "$MATCHES" -eq 0 ]; then
                echo "   - ⚠️ النص الأصلي لم يتم العثور عليه في $FILE_PATH. تخطي."
                continue
              fi
              python3 - "$FILE_PATH" "$ORIGINAL_CODE" "$SUGGESTED_CODE" <<'PY'
import sys
p, orig, sugg = sys.argv[1], sys.argv[2], sys.argv[3]
with open(p, 'r', encoding='utf-8') as f:
    content = f.read()
new_content = content.replace(orig, sugg)
with open(p, 'w', encoding='utf-8') as f:
    f.write(new_content)
print(f"   - ✅ تم تعديل {p} ({content.count(orig)} استبدال).")
PY

            elif [ "$ACTION" = "delete" ]; then
              if [ -f "$FILE_PATH" ]; then
                rm -f "$FILE_PATH"
                echo "   - ✅ تم حذف الملف."
              else
                echo "   - ⚠️ الملف $FILE_PATH غير موجود لحذفه."
              fi

            else
              echo "   - ⚠️ نوع إجراء غير معروف: $ACTION"
            fi
          done
          echo "🏆 اكتمل تنفيذ خطة العمل."

      - name: 💾 حفظ ورفع التغييرات كـ Pull Request
        run: |
          set -e
          cd target-repo
          BRANCH_NAME="ai
