name: 🤖 Ultimate Forge Pro - The AI Engineer

on:
  workflow_dispatch:
    inputs:
      target_owner:
        description: 'مالك المستودع الهدف'
        required: true
      target_repo:
        description: 'اسم المستودع الهدف'
        required: true
      target_token:
        description: 'GitHub PAT (صلاحيات workflow و repo)'
        required: true
      improvement_type:
        description: 'نوع التحسين'
        required: true
        default: 'all'
      custom_command:
        description: 'الأمر المطلوب من واجهة Forge Optimizer'
        required: true

jobs:
  total-control-execution:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 جلب المستودع (شامل الملفات المخفية)
        run: |
          set -e
          git clone "https://x-access-token:${{ github.event.inputs.target_token }}@github.com/${{ github.event.inputs.target_owner }}/${{ github.event.inputs.target_repo }}.git" workspace
          cd workspace
          git config --global user.name "Genesis Forge AI"
          git config --global user.email "ai@genesis-forge.com"

      - name: 🔍 مسح شامل لكل شبر (بما في ذلك .github)
        run: |
          cd workspace
          # البحث يشمل كل الملفات حتى ملفات الـ Workflow نفسها
          find . -maxdepth 4 -not -path '*/.*' -o -path './.github*' > ../full_structure.txt

      - name: 🤖 توليد خطة العمل (بناءً على أمر الواجهة)
        run: |
          # هنا يتم استقبال "custom_command" من تطبيقك وتحويله لخطة JSON
          cat << 'EOF' > ai_response.json
          {
            "summary": "تنفيذ الأمر: ${{ github.event.inputs.custom_command }}",
            "plan": [
              {
                "action": "modify",
                "file_path": ".github/workflows/repo-optimizer.yml",
                "original_code": "timeout-minutes: 30",
                "suggested_code": "timeout-minutes: 60"
              },
              {
                "action": "create",
                "file_path": "FORGE_LOG.md",
                "content": "# سجل Forge Optimizer\nتم تنفيذ الأمر: ${{ github.event.inputs.custom_command }}"
              }
            ]
          }
          EOF

      - name: ⚙️ تنفيذ التعديلات (إصلاح سطر 88 الجذري)
        run: |
          sudo apt-get update && sudo apt-get install -y jq python3
          cd workspace
          
          # استخراج الخطوات من الـ JSON وتنفيذها
          jq -c '.plan[]' ../ai_response.json | while read -r step; do
            ACTION=$(echo "$step" | jq -r '.action')
            FILE_PATH=$(echo "$step" | jq -r '.file_path')
            
            echo "▶️ معالجة الملف: $FILE_PATH"
            
            if [ "$ACTION" = "create" ]; then
              mkdir -p "$(dirname "$FILE_PATH")"
              echo "$step" | jq -r '.content' > "$FILE_PATH"
              
            elif [ "$ACTION" = "modify" ]; then
              ORIG=$(echo "$step" | jq -r '.original_code')
              SUGG=$(echo "$step" | jq -r '.suggested_code')
              
              # الطريقة الصحيحة لمنع خطأ سطر 88: كتابة السكريبت في ملف مؤقت أولاً
              echo "import sys, os
path, orig, sugg = sys.argv[1], sys.argv[2], sys.argv[3]
if os.path.exists(path):
    with open(path, 'r', encoding='utf-8') as f:
        content = f.read()
    if orig in content:
        with open(path, 'w', encoding='utf-8') as f:
            f.write(content.replace(orig, sugg))
        print(f'✅ Modified: {path}')
" > ../modifier.py
              
              python3 ../modifier.py "$FILE_PATH" "$ORIG" "$SUGG"
            fi
          done

      - name: 🚀 رفع التغييرات (دفع لكل شبر في المستودع)
        run: |
          cd workspace
          git add -A # إضافة كل شيء بما في ذلك تعديلات الـ YML
          git commit -m "🤖 [Genesis Forge Pro]: ${{ github.event.inputs.custom_command }}" || echo "لا توجد تغييرات"
          git push origin main
