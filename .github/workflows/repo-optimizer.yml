name: Repo Optimizer
on:
  workflow_dispatch:
    inputs:
      target_owner:
        description: 'مالك المستودع الهدف'
        required: true
        type: string
      target_repo:
        description: 'اسم المستودع الهدف'
        required: true
        type: string
      improvement_type:
        description: 'نوع التحسين'
        required: true
        type: choice
        options:
          - code_quality
          - performance
          - error_handling
          - documentation
          - security
          - all
        default: 'code_quality'

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: ✅ اختبار الاتصال
        run: |
          echo "🎉 Ultimate Forge يعمل!"
          echo "🎯 الهدف: ${{ github.event.inputs.target_owner }}/${{ github.event.inputs.target_repo }}"
          echo "🔧 النوع: ${{ github.event.inputs.improvement_type }}"
