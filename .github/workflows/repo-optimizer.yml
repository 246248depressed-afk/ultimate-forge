# اسم الـ workflow الذي سيظهر في واجهة GitHub Actions
name: 🤖 Ultimate Forge Pro - The AI Engineer

# القسم الذي يحدد متى يتم تشغيل هذا الـ workflow
on:
  # يسمح بالتشغيل اليدوي من واجهة GitHub أو عبر API
  workflow_dispatch:
    # تعريف المدخلات التي سيتم طلبها عند التشغيل اليدوي
    inputs:
      target_owner:
        description: 'مالك المستودع الهدف (الذي سيتم تعديله)'
        required: true
      target_repo:
        description: 'اسم المستودع الهدف'
        required: true
      target_token:
        description: 'GitHub PAT للمستودع الهدف (مع صلاحيات repo و workflow)'
        required: true
      custom_command:
        description: 'الأمر المطلوب من واجهة Forge Optimizer (مثال: تحسين أداء الكود)'
        required: true

# تعريف المهام (Jobs) التي سيتم تنفيذها
jobs:
  # اسم المهمة، يمكن أن يكون أي اسم
  total-control-execution:
    # تحديد نوع الخادم الافتراضي الذي ستعمل عليه المهمة
    runs-on: ubuntu-latest
    
    # تعريف الخطوات (Steps) التي ستنفذها المهمة بالترتيب
    steps:
      # الخطوة الأولى: جلب المستودع الهدف
      - name: 📥 جلب المستودع الهدف
        run: |
          # الخروج فورًا في حال حدوث أي خطأ
          set -e
          # استنساخ المستودع الهدف باستخدام التوكن لتأكيد الصلاحية
          git clone "https://x-access-token:${{ github.event.inputs.target_token }}@github.com/${{ github.event.inputs.target_owner }}/${{ github.event.inputs.target_repo }}.git" workspace
          # الدخول إلى مجلد العمل
          cd workspace
          # إعداد هوية Git لعملية الـ commit لاحقًا
          git config --global user.name "Genesis Forge AI"
          git config --global user.email "ai@genesis-forge.com"

      # الخطوة الثانية: مسح بنية الملفات
      - name: 🔍 مسح شامل لبنية الملفات
        run: |
          cd workspace
          # إنشاء قائمة بكل الملفات والمجلدات لإعطاء سياق للذكاء الاصطناعي
          find . -maxdepth 4 > ../full_structure.txt

      # الخطوة الثالثة: توليد خطة عمل (محاكاة لاستدعاء ذكاء اصطناعي)
      - name: 🤖 توليد خطة العمل (بناءً على أمر الواجهة)
        run: |
          # في التطبيق الحقيقي، هذه الخطوة ستستدعي API لنموذج لغوي
          # حاليًا، هي تنشئ ملف JSON ثابت كمثال
          cat << 'EOF' > ../ai_response.json
          {
            "summary": "تنفيذ الأمر: ${{ github.event.inputs.custom_command }}",
            "plan": [
              {
                "action": "modify",
                "file_path": "README.md",
                "original_code": "مرحباً",
                "suggested_code": "مرحباً بك في المستودع المحسّن!"
              },
              {
                "action": "create",
                "file_path": "FORGE_LOG.md",
                "content": "# سجل Forge Optimizer\n\nتم تنفيذ الأمر التالي بنجاح:\n**${{ github.event.inputs.custom_command }}**"
              }
            ]
          }
          EOF

      # الخطوة الرابعة: تنفيذ التعديلات المخطط لها
      - name: ⚙️ تنفيذ التعديلات
        # استخدام '|' للسماح بكتابة سكربت متعدد الأسطر
        run: |
          echo "🔧 جاري إعداد البيئة..."
          # تثبيت الأدوات اللازمة: jq لتحليل JSON و python3 لتشغيل السكربت
          sudo apt-get update && sudo apt-get install -y jq python3
          
          echo "🐍 إنشاء سكربت Python للتعديل الآمن..."
          # استخدام 'cat' لإنشاء ملف سكربت بايثون مؤقت. هذا يحل كل مشاكل المسافات البادئة في YAML
          cat > ../modifier.py << 'EOF'
import sys
import os

def modify_file(file_path, original, suggested):
    try:
        if not os.path.exists(file_path):
            print(f"❌ الملف غير موجود: {file_path}")
            return False

        with open(file_path, 'r', encoding='utf-8') as f:
            content = f.read()

        new_content = content.replace(original, suggested)
        
        with open(file_path, 'w', encoding='utf-8') as f:
            f.write(new_content)
        print(f"✅ تم تعديل الملف: {file_path}")
        return True
            
    except Exception as e:
        print(f"❌ حدث خطأ استثنائي أثناء تعديل الملف {file_path}: {e}")
        return False

