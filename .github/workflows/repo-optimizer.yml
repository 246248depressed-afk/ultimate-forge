name: Ultimate Forge Pro - Genesis System

on:
  workflow_dispatch:
    inputs:
      target_owner:
        description: 'مالك المستودع الهدف'
        required: true
        type: string
      target_repo:
        description: 'اسم المستودع الهدف'
        required: true
        type: string
      target_token:
        description: 'GitHub Token للمستودع الهدف (للوصول)'
        required: true
        type: string
      improvement_type:
        description: 'نوع التحسين المطلوب'
        type: choice
        options:
          - code_quality
          - performance
          - documentation
          - all
        default: 'code_quality'
      custom_command:
        description: 'أمر مخصص لتنفيذه'
        type: string

env:
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  INPUT_JSON: ${{ toJSON(github.event.inputs) }}

jobs:
  check-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      can_access: ${{ steps.check_access.outputs.can_access }}
      project_type: ${{ steps.detect_project.outputs.project_type }}
    
    steps:
      - name: 🔐 فحص صلاحيات الوصول
        id: check_access
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token ${{ github.event.inputs.target_token }}" "https://api.github.com/repos/${{ github.event.inputs.target_owner }}/${{ github.event.inputs.target_repo }}")
          if [ "$RESPONSE" == "200" ]; then
            echo "✅ الوصول ممكن"
            echo "can_access=true" >> $GITHUB_OUTPUT
          else
            echo "❌ فشل الوصول، رمز الحالة: $RESPONSE"
            echo "can_access=false" >> $GITHUB_OUTPUT
            # exit 1 # This would stop the workflow
          fi

      - name: 🔍 تحليل المشروع (إذا كان الوصول ممكناً)
        id: detect_project
        if: steps.check_access.outputs.can_access == 'true'
        run: |
          echo "📥 جلب المستودع للتحليل..."
          REPO_URL="https://x-access-token:${{ github.event.inputs.target_token }}@github.com/${{ github.event.inputs.target_owner }}/${{ github.event.inputs.target_repo }}.git"
          git clone --depth 1 "$REPO_URL" temp-repo
          cd temp-repo
          
          if [ -f "build.gradle" ] || [ -f "app/build.gradle" ]; then
            echo "project_type=Android" >> $GITHUB_OUTPUT
            echo "🐘 المشروع من نوع Android"
          elif [ -f "package.json" ]; then
            echo "project_type=NodeJS" >> $GITHUB_OUTPUT
            echo "📦 المشروع من نوع NodeJS"
          elif [ -f "pom.xml" ]; then
            echo "project_type=Java" >> $GITHUB_OUTPUT
            echo "☕️ المشروع من نوع Java"
          elif [ -f "requirements.txt" ]; then
            echo "project_type=Python" >> $GITHUB_OUTPUT
            echo "🐍 المشروع من نوع Python"
          else
            echo "project_type=General" >> $GITHUB_OUTPUT
            echo "❓ نوع المشروع عام"
          fi
          cd ..
          rm -rf temp-repo

  optimize-repository:
    needs: check-and-analyze
    if: needs.check-and-analyze.outputs.can_access == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🚀 بدء التحسين
        run: |
          echo "🚀 Genesis Forge Fix - بدء التحسين"
          echo "🎯 المستودع: ${{ github.event.inputs.target_owner }}/${{ github.event.inputs.target_repo }}"
          echo "🔧 النوع: ${{ github.event.inputs.improvement_type }}"
          echo "🧠 نوع المشروع المحدد: ${{ needs.check-and-analyze.outputs.project_type }}"
          echo "🔑 مفتاح Deepseek: ${{ env.DEEPSEEK_API_KEY != '' }}"

      - name: 📥 جلب المستودع الهدف
        env:
          TARGET_TOKEN: ${{ github.event.inputs.target_token }}
        run: |
          REPO_URL="https://x-access-token:$TARGET_TOKEN@github.com/${{ github.event.inputs.target_owner }}/${{ github.event.inputs.target_repo }}.git"
          git clone "$REPO_URL" target-repo
          cd target-repo
          git config user.email "genesis-forge@ai.com"
          git config user.name "Genesis Forge [AI]"
          echo "🌳 تم جلب وتكوين المستودع"

      - name: 🧠 تحليل الكود بواسطة الذكاء الاصطناعي
        run: |
          cd target-repo
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            echo "🧠 استخدام Deepseek AI للتحليل..."
            # (Logic for AI analysis would go here)
            FILE_COUNT=$(find . -name "*.java" -o -name "*.kt" | wc -l)
            echo "📊 عدد ملفات Java/Kotlin هو: $FILE_COUNT"
          else
            echo "⚠️ مفتاح Deepseek API غير موجود، سيتم تخطي التحليل بالذكاء الاصطناعي."
          fi

      - name: 🛠️ تطبيق التحسينات
        run: |
          cd target-repo
          # This is a placeholder for the actual improvement logic
          echo "## 📅 التحسينات المطبقة" >> IMPROVEMENTS.md
          echo "" >> IMPROVEMENTS.md
          echo "- **النوع:** ${{ github.event.inputs.improvement_type }}" >> IMPROVEMENTS.md
          echo "- **الوقت:** $(date)" >> IMPROVEMENTS.md
