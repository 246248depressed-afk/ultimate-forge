name: 🤖 Ultimate Forge Pro - The AI Engineer (Full Access)

on:
  workflow_dispatch:
    inputs:
      target_owner:
        description: 'مالك المستودع'
        required: true
      target_repo:
        description: 'اسم المستودع'
        required: true
      target_token:
        description: 'GitHub PAT (يجب أن يحتوي على صلاحيات workflow و repo)'
        required: true
      improvement_type:
        description: 'نوع المهمة'
        required: true
        type: choice
        options: [code_quality, performance, add_feature, documentation, security, all]
        default: 'all'
      custom_command:
        description: 'ما الذي تريد فعله بالضبط؟ (مثال: عدل ملفات الـ workflow لتكون أسرع)'
        required: true

jobs:
  total-control-execution:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 جلب المستودع (بما في ذلك الملفات المخفية والـ Workflows)
        run: |
          set -e
          # استخدام الـ Token الممرر للوصول الكامل
          git clone "https://x-access-token:${{ github.event.inputs.target_token }}@github.com/${{ github.event.inputs.target_owner }}/${{ github.event.inputs.target_repo }}.git" workspace
          cd workspace
          # جلب كل الفروع والتأكد من الصلاحيات
          git config --global user.name "Genesis Forge AI"
          git config --global user.email "ai@genesis-forge.com"
          echo "✅ تم جلب المستودع بالكامل."

      - name: 🔍 مسح شامل (بما في ذلك .github)
        run: |
          cd workspace
          # تم إزالة فلاتر الاستثناء ليتعرف الـ AI على كل ملف في المستودع بما فيها ملفات الـ YML
          find . -maxdepth 4 -not -path '*/.*' -o -path './.github*' > ../full_structure.txt
          echo "✅ تم مسح كافة أرجاء المستودع."

      - name: 🤖 محاكاة ذكاء المهندس (خطة تعديل الـ YML)
        run: |
          cat << 'EOF' > ai_response.json
          {
            "summary": "تعديل شامل يتضمن ملفات النظام والبرمجيات.",
            "plan": [
              {
                "action": "modify",
                "file_path": ".github/workflows/repo-optimizer.yml",
                "original_code": "timeout-minutes: 30",
                "suggested_code": "timeout-minutes: 60"
              },
              {
                "action": "create",
                "file_path": "AUTO_GENERATED_BY_AI.md",
                "content": "# تم الوصول بنجاح\nلقد قام المهندس AI بمسح المستودع بالكامل ووصل إلى ملفات الـ Workflow."
              }
            ]
          }
          EOF

      - name: ⚙️ تنفيذ التعديلات (صلاحيات كاملة)
        run: |
          sudo apt-get install -y jq python3
          cd workspace
          
          jq -c '.plan[]' ../ai_response.json | while read -r step; do
            ACTION=$(echo "$step" | jq -r '.action')
            FILE_PATH=$(echo "$step" | jq -r '.file_path')
            
            echo "▶️ معالجة: $FILE_PATH"
            
            if [ "$ACTION" = "create" ]; then
              mkdir -p "$(dirname "$FILE_PATH")"
              echo "$step" | jq -r '.content' > "$FILE_PATH"
            
            elif [ "$ACTION" = "modify" ]; then
              ORIG=$(echo "$step" | jq -r '.original_code')
              SUGG=$(echo "$step" | jq -r '.suggested_code')
              
              python3 - "$FILE_PATH" "$ORIG" "$SUGG" <<'PY'
import sys, os
path, orig, sugg = sys.argv[1], sys.argv[2], sys.argv[3]
if os.path.exists(path):
    with open(path, 'r', encoding='utf-8') as f:
        content = f.read()
    if orig in content:
        with open(path, 'w', encoding='utf-8') as f:
            f.write(content.replace(orig, sugg))
        print(f"✅ تم تعديل: {path}")
PY
            fi
          done

      - name: 🚀 رفع التغييرات (Push) مباشرة للمستودع
        run: |
          cd workspace
          git add -A # إضافة كل شيء بما في ذلك الملفات المخفية
          git commit -m "🤖 [AI Engine]: تحديث شامل للمستودع وملفات الـ Workflow" || echo "No changes"
          # استخدام الـ Token في عملية الـ Push لضمان تخطي حماية الفروع إن أمكن
          git push origin main
