name: 🔥 Genesis Forge Pro – Full Access AI Engineer

on:
  workflow_dispatch:
    inputs:
      target_owner:
        description: 'مالك المستودع الهدف'
        required: true
        type: string
      target_repo:
        description: 'اسم المستودع الهدف'
        required: true
        type: string
      ai_prompt:
        description: 'البرومبت (مثال: أعد كتابة main.py ليطبع Hello AI)'
        required: true
        type: string
      file_to_change:
        description: 'الملف الذي سيتم تعديله (مثال: main.py)'
        required: true
        default: 'main.py'
      base_branch:
        description: 'الفرع الأساسي'
        required: true
        default: main

permissions:
  contents: write
  pull-requests: write

env:
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  TARGET_TOKEN: ${{ secrets.TARGET_TOKEN }}

jobs:
  genesis-forge:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # الخطوة 1: استنساخ مستودع الـ Workflow نفسه للوصول إلى السكربت
      - name: 📥 استنساخ مستودع الـ Workflow
        uses: actions/checkout@v4
        with:
          path: workflow_repo # في مجلد منفصل

      # الخطوة 2: استنساخ المستودع الهدف الذي سنقوم بتعديله
      - name: 📥 استنساخ المستودع الهدف
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.target_owner }}/${{ github.event.inputs.target_repo }}
          token: ${{ env.TARGET_TOKEN }}
          path: target

      # الخطوة 3: إعداد Python
      - name: 🐍 إعداد بيئة Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # الخطوة 4: إرسال البرومبت إلى DeepSeek
      - name: 🧠 إرسال البرومبت إلى DeepSeek
        id: deep
